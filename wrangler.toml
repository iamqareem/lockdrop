# Cloudflare Pages configuration for LockDrop.
#
# There is deliberately NO build step: the frontend in `public/` is plain
# HTML, CSS and native ES modules, and the backend in `functions/` is bundled
# by wrangler from TypeScript with zero npm runtime dependencies.
#
# Connect the GitHub repository to a Pages project with:
#   Build command:   (leave empty)
#   Build output:    public
#
# Then add the secrets listed in .env.example as Pages environment secrets.

name = "lockdrop"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"

# Workers AI — used for link safety judgement.
#
# The AI binding is NOT declared here on purpose. Pages reads only the
# root-level wrangler.toml, so a local override file is not possible, and a
# declared remote binding makes `wrangler pages dev` require a
# CLOUDFLARE_API_TOKEN. Instead the binding is added in the Cloudflare
# dashboard (Settings -> Bindings -> Workers AI, variable name `AI`), which
# is what Cloudflare's Pages documentation prescribes.
#
# The code treats the binding as optional: without it the verification engine
# falls back to the heuristics and the footer reads "Locally verified".

# Plain (non-secret) environment values. Secrets live in `wrangler secret put`.
[vars]
POLYGON_RPC_URL = "https://polygon-bor-rpc.publicnode.com"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
AI_DAILY_BUDGET = "8000"

# Secrets — set with `wrangler pages secret put <NAME>`:
#   TURSO_DATABASE_URL     libsql://lockdrop-xxxx.turso.io
#   TURSO_AUTH_TOKEN       Turso bearer token
#   LOCKDROP_MASTER_KEY    64 hex characters (32 bytes)
#   ADMIN_TOKEN            admin bearer token
#   ESCROW_ADDRESS         deployed PolygonEscrow.sol address
#   ADSGRAM_BLOCK_ID       Adsgram rewarded-video block (Telegram)
#   MONETAG_DIRECT_LINK    Monetag smartlink for web sponsored tasks
#   OPENROUTER_API_KEY     optional fallback judge
