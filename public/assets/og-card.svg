<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- brand mark -->
  <g transform="translate(84 84)">
    <rect width="64" height="64" rx="16" fill="#18181b"/>
    <g transform="translate(12 12) scale(1.67)" fill="none" stroke="#fafafa" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12.5 14.5v-3a3.5 3.5 0 1 1 7 0v3"/>
      <rect x="9.5" y="14.5" width="13" height="10" rx="2.5"/>
      <path d="M16 18v3"/>
    </g>
  </g>

  <text x="168" y="130" font-size="42" font-weight="700" fill="#18181b" letter-spacing="-1">LockDrop</text>
  <text x="168" y="166" font-size="19" fill="#71717a" letter-spacing="2.4">POLYGON POS ESCROW</text>

  <text x="84" y="320" font-size="72" font-weight="700" fill="#18181b" letter-spacing="-2.6">Lock a link.</text>
  <text x="84" y="404" font-size="72" font-weight="700" fill="#18181b" letter-spacing="-2.6">Unlock it on payment.</text>

  <text x="84" y="474" font-size="25" fill="#71717a">Peer-to-peer escrow for sharing files and links.</text>
  <text x="84" y="512" font-size="25" fill="#71717a">Every link is verified before it is published.</text>

  <!-- verdict chips -->
  <g transform="translate(84 552)">
    <rect width="150" height="46" rx="23" fill="none" stroke="#e4e4e7"/>
    <text x="75" y="30" font-size="17" fill="#71717a" text-anchor="middle" letter-spacing="1.4">TRUSTED</text>
  </g>
  <g transform="translate(248 552)">
    <rect width="150" height="46" rx="23" fill="none" stroke="#e4e4e7"/>
    <text x="75" y="30" font-size="17" fill="#71717a" text-anchor="middle" letter-spacing="1.4">CAUTION</text>
  </g>
  <g transform="translate(412 552)">
    <rect width="150" height="46" rx="23" fill="none" stroke="#e4e4e7"/>
    <text x="75" y="30" font-size="17" fill="#71717a" text-anchor="middle" letter-spacing="1.4">BLOCKED</text>
  </g>

  <rect x="0" y="626" width="1200" height="4" fill="#18181b"/>
</svg>
