name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Hardhat 3 requires Node 22.13 or later.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check ABI selectors, contract artifact, category sync and Turso read path
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Contract tests
        run: npm run contract:test
